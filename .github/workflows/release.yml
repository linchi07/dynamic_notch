name: Release

# Manual, fork-only release pipeline: archive -> Developer ID sign -> notarize ->
# staple -> DMG -> Sparkle-sign -> appcast -> GitHub Release -> publish feed.
#
# SECURITY
# --------
# This workflow is `workflow_dispatch` ONLY. It must never gain a
# `pull_request` / `pull_request_target` / `issue_comment` trigger: it holds the
# Developer ID signing identity, the App Store Connect notarization key and the
# Sparkle EdDSA private key.
#
# The upstream project's release.yml was an `issue_comment`-triggered flow that
# pushed a Homebrew cask to TheBoredTeam/homebrew-boring-notch. That file has
# been replaced by this one so a release run can only ever touch
# linchi07/dynamic_notch.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   BUILD_CERTIFICATE_BASE64  base64 of the "Developer ID Application" .p12
#   P12_PASSWORD              password of that .p12
#   APPLE_TEAM_ID             10-character team id
#   ASC_KEY_ID                App Store Connect API key id
#   ASC_ISSUER_ID             App Store Connect API issuer id
#   ASC_KEY_P8                the .p8 key, base64-encoded (raw PEM also accepted)
#   SPARKLE_ED_PRIVATE_KEY    Sparkle EdDSA private key file contents
#                             (`generate_keys --account dynamicnotch -x file`)
#
# Optional repository variable:
#   DOWNLOAD_BASE             e.g. https://notch.wejoinnwk.com/downloads
#                             When set, the appcast points there instead of at
#                             the GitHub release asset. The workflow verifies
#                             the URL actually serves the DMG before writing the
#                             feed, so a missing mirror fails the run instead of
#                             shipping a feed nobody can download from.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, must equal MARKETING_VERSION in project.pbxproj (e.g. 1.2)"
        required: true
        type: string
      build:
        description: "CFBundleVersion. Must be greater than every build already in the appcast."
        required: true
        type: string
      min_system_version:
        description: "Sparkle minimumSystemVersion recorded for this item"
        required: false
        default: "14.0"
        type: string
      download_base:
        description: "Override the download base URL for the appcast (empty = repo variable, then GitHub release)"
        required: false
        default: ""
        type: string
      notes_file:
        description: "Repo path to release notes (HTML). Empty = generated from commits since the last tag."
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Build, sign and notarize, then stop without publishing anything"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PROJECT: DynamicNotch.xcodeproj
  SCHEME: DynamicNotch
  APP_NAME: DynamicNotch
  UPSTREAM_REPO: TheBoredTeam/boring.notch
  SIGN_IDENTITY_NAME: "Developer ID Application"

jobs:
  release:
    name: Build, notarize and publish
    runs-on: macos-15
    environment: release
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      build: ${{ steps.inputs.outputs.build }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # Guards. These exist because a release run is the one place where a
      # mistake is expensive and irreversible.
      # ------------------------------------------------------------------
      - name: Validate inputs and repository
        id: inputs
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REPOSITORY}" = "${UPSTREAM_REPO}" ]; then
            echo "::error::refusing to release from the upstream repository (${UPSTREAM_REPO})"
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY}" != "linchi07/dynamic_notch" ]; then
            echo "::warning::releasing from ${GITHUB_REPOSITORY}, expected linchi07/dynamic_notch"
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::releases must be cut from main, got ${GITHUB_REF}"
            exit 1
          fi

          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::version must be dotted digits, got '${VERSION}'"
            exit 1
          fi
          if ! printf '%s' "${BUILD}" | grep -Eq '^[0-9]+$' || [ "${BUILD}" -lt 1 ]; then
            echo "::error::build must be a positive integer, got '${BUILD}'"
            exit 1
          fi

          # The binary and the appcast must not disagree about what this is.
          for pair in "MARKETING_VERSION=${VERSION}" "CURRENT_PROJECT_VERSION=${BUILD}"; do
            key="${pair%%=*}"
            want="${pair#*=}"
            found="$(grep -o "${key} = [^;]*" "${PROJECT}/project.pbxproj" \
                     | sed "s/.*= //" | tr -d ' ' | sort -u | tr '\n' ' ')"
            if [ "${found% }" != "${want}" ]; then
              echo "::error::${key} in project.pbxproj is '${found% }' but this release says '${want}'."
              echo "::error::Update project.pbxproj first, then re-run."
              exit 1
            fi
          done

          # Sparkle compares CFBundleVersion, so it must never move backwards.
          highest="$(grep -o '<sparkle:version>[^<]*</sparkle:version>' updater/appcast.xml \
                     | sed 's/<[^>]*>//g' | sort -n | tail -1)"
          highest="${highest:-0}"
          if [ "${BUILD}" -le "${highest}" ]; then
            echo "::error::build ${BUILD} is not greater than ${highest}, the highest build already in the feed."
            echo "::error::Sparkle would never offer this update. Bump the build number."
            exit 1
          fi

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag v${VERSION} already exists."
            echo "::error::Bump the marketing version, or delete the existing release and tag to re-cut it."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "Releasing DynamicNotch ${VERSION} (build ${BUILD}); highest published build is ${highest}."

      - name: Set up signing identity and notarization key
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail

          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD APPLE_TEAM_ID ASC_KEY_ID ASC_KEY_P8; do
            if [ -z "${!name:-}" ]; then
              echo "::error::secret ${name} is not set. See the header of this workflow for the full list."
              exit 1
            fi
          done

          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          echo "${BUILD_CERTIFICATE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN_PATH}" \
            -P "${P12_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "${RUNNER_TEMP}/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychain -d user -s "${KEYCHAIN_PATH}"

          identity="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" \
                      | grep "${SIGN_IDENTITY_NAME}" | head -1 \
                      | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "${identity}" ]; then
            echo "::error::no '${SIGN_IDENTITY_NAME}' identity in the imported certificate."
            echo "::error::An Apple Distribution / Apple Development certificate cannot be used for notarization."
            security find-identity -v -p codesigning "${KEYCHAIN_PATH}" || true
            exit 1
          fi
          echo "::add-mask::${identity}"

          # The .p8 may be stored raw or base64-encoded; accept both.
          ASC_KEY_PATH="${RUNNER_TEMP}/asc_api_key.p8"
          if printf '%s' "${ASC_KEY_P8}" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "${ASC_KEY_P8}" > "${ASC_KEY_PATH}"
          else
            printf '%s' "${ASC_KEY_P8}" | base64 --decode > "${ASC_KEY_PATH}"
          fi
          if ! grep -q 'BEGIN PRIVATE KEY' "${ASC_KEY_PATH}"; then
            echo "::error::ASC_KEY_P8 does not decode to a PEM private key."
            exit 1
          fi
          chmod 600 "${ASC_KEY_PATH}"

          echo "keychain_path=${KEYCHAIN_PATH}" >> "$GITHUB_OUTPUT"
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"
          echo "asc_key_path=${ASC_KEY_PATH}" >> "$GITHUB_OUTPUT"
          echo "Signed in as: ${identity}"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "${PROJECT}" -scheme "${SCHEME}" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/spm"

      - name: Archive
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.inputs.outputs.version }}
          BUILD: ${{ steps.inputs.outputs.build }}
        run: |
          set -euo pipefail
          # The project sets CODE_SIGN_IDENTITY[sdk=macosx*] = "-" (ad-hoc) for
          # local development. That sdk-qualified setting wins over the plain
          # CODE_SIGN_IDENTITY, so both have to be overridden here.
          #
          # ARCHS is pinned so the shipped app is a universal binary regardless
          # of which architecture the runner happens to be.
          xcodebuild archive \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            -derivedDataPath "${RUNNER_TEMP}/dd" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/spm" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_IDENTITY="${SIGN_IDENTITY_NAME}" \
            "CODE_SIGN_IDENTITY[sdk=macosx*]=${SIGN_IDENTITY_NAME}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            ENABLE_HARDENED_RUNTIME=YES \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD}" \
            -quiet

      - name: Collect the built app
        id: app
        env:
          EXPECTED_BUILD: ${{ steps.inputs.outputs.build }}
        run: |
          set -euo pipefail
          APP="${RUNNER_TEMP}/export/${APP_NAME}.app"
          rm -rf "${RUNNER_TEMP}/export"
          mkdir -p "${RUNNER_TEMP}/export"
          cp -R "${RUNNER_TEMP}/${APP_NAME}.xcarchive/Products/Applications/${APP_NAME}.app" "${APP}"

          archs="$(lipo -archs "${APP}/Contents/MacOS/${APP_NAME}")"
          echo "Architectures: ${archs}"
          case "${archs}" in
            *arm64*x86_64*|*x86_64*arm64*) ;;
            *)
              echo "::error::the app is not universal (got '${archs}'). Intel Macs could not run it."
              exit 1
              ;;
          esac

          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Contents/Info.plist")"
          plist_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${APP}/Contents/Info.plist")"
          feed="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "${APP}/Contents/Info.plist")"
          echo "Built ${APP_NAME} ${plist_version} (${plist_build}), feed ${feed}"
          if [ "${plist_build}" != "${EXPECTED_BUILD}" ]; then
            echo "::error::CFBundleVersion is ${plist_build}, expected ${EXPECTED_BUILD}"
            exit 1
          fi
          echo "path=${APP}" >> "$GITHUB_OUTPUT"

      - name: Repair and verify nested code signatures
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          APP: ${{ steps.app.outputs.path }}
        run: |
          set -euo pipefail
          # MediaRemoteAdapter.framework and MediaRemoteAdapterTestClient ship
          # ad-hoc signed with no hardened runtime, and Xcode never signs the
          # latter (it lands in Contents/Resources). notarytool rejects both.
          # See the header of the script for the full explanation.
          "${GITHUB_WORKSPACE}/scripts/sign_nested_and_verify.sh" fix "${APP}" "${IDENTITY}"

      - name: Check the Sparkle signing key matches the shipped public key
        env:
          APP: ${{ steps.app.outputs.path }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # If these disagree, sign_update still succeeds and the appcast still
          # validates - and every client silently refuses every update, forever.
          # Cheaper to catch here than in the field.
          printf '%s' "${SPARKLE_ED_PRIVATE_KEY}" \
            | python3 "${GITHUB_WORKSPACE}/scripts/sparkle_key_check.py" check \
                --key-file - \
                --info-plist "${APP}/Contents/Info.plist"

      - name: Notarize and staple the app
        env:
          ASC_KEY_PATH: ${{ steps.signing.outputs.asc_key_path }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP: ${{ steps.app.outputs.path }}
        run: |
          set -euo pipefail
          ZIP="${RUNNER_TEMP}/${APP_NAME}.zip"
          ditto -c -k --keepParent "${APP}" "${ZIP}"

          result="$(xcrun notarytool submit "${ZIP}" \
            --key "${ASC_KEY_PATH}" --key-id "${ASC_KEY_ID}" --issuer "${ASC_ISSUER_ID}" \
            --wait --output-format json || true)"
          echo "${result}"
          submission_id="$(printf '%s' "${result}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)"
          status="$(printf '%s' "${result}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)"

          if [ "${status}" != "Accepted" ]; then
            echo "::error::notarization of the app failed (status='${status}')"
            if [ -n "${submission_id}" ]; then
              xcrun notarytool log "${submission_id}" \
                --key "${ASC_KEY_PATH}" --key-id "${ASC_KEY_ID}" --issuer "${ASC_ISSUER_ID}" || true
            fi
            exit 1
          fi

          xcrun stapler staple "${APP}"
          xcrun stapler validate "${APP}"
          rm -f "${ZIP}"

      - name: Build the DMG
        id: dmg
        env:
          APP: ${{ steps.app.outputs.path }}
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          set -euo pipefail
          DMG="${RUNNER_TEMP}/${APP_NAME}-${VERSION}.dmg"
          rm -f "${DMG}"

          dmgbuild_ok=false
          if python3 -m venv "${RUNNER_TEMP}/dmgvenv" >/dev/null 2>&1 \
             && "${RUNNER_TEMP}/dmgvenv/bin/pip" install --quiet --require-hashes \
                  -r Configuration/dmg/requirements.txt >/dev/null 2>&1; then
            dmgbuild_ok=true
          fi

          if [ "${dmgbuild_ok}" = "true" ]; then
            echo "Creating the DMG with dmgbuild (project layout)"
            PATH="${RUNNER_TEMP}/dmgvenv/bin:${PATH}" \
              ./Configuration/dmg/create_dmg.sh "${APP}" "${DMG}" "${APP_NAME}"
          else
            echo "::warning::dmgbuild could not be installed; falling back to a plain hdiutil image (no custom background)"
            STAGE="${RUNNER_TEMP}/dmg-stage"
            rm -rf "${STAGE}"
            mkdir -p "${STAGE}"
            cp -R "${APP}" "${STAGE}/"
            ln -s /Applications "${STAGE}/Applications"
            hdiutil create -volname "${APP_NAME}" -srcfolder "${STAGE}" \
              -ov -format UDZO "${DMG}"
            rm -rf "${STAGE}"
          fi

          [ -f "${DMG}" ] || { echo "::error::DMG was not produced at ${DMG}"; exit 1; }
          echo "path=${DMG}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${DMG}")" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -f%z "${DMG}")" >> "$GITHUB_OUTPUT"

      - name: Sign, notarize and staple the DMG
        env:
          ASC_KEY_PATH: ${{ steps.signing.outputs.asc_key_path }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp \
            --sign "${IDENTITY}" "${DMG}"
          codesign --verify --verbose=2 "${DMG}"

          result="$(xcrun notarytool submit "${DMG}" \
            --key "${ASC_KEY_PATH}" --key-id "${ASC_KEY_ID}" --issuer "${ASC_ISSUER_ID}" \
            --wait --output-format json || true)"
          echo "${result}"
          submission_id="$(printf '%s' "${result}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)"
          status="$(printf '%s' "${result}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)"

          if [ "${status}" != "Accepted" ]; then
            echo "::error::notarization of the DMG failed (status='${status}')"
            if [ -n "${submission_id}" ]; then
              xcrun notarytool log "${submission_id}" \
                --key "${ASC_KEY_PATH}" --key-id "${ASC_KEY_ID}" --issuer "${ASC_ISSUER_ID}" || true
            fi
            exit 1
          fi

          xcrun stapler staple "${DMG}"
          xcrun stapler validate "${DMG}"

          # A quick end-to-end Gatekeeper opinion. spctl on the .app uses the
          # execution context; this is the check a user's Mac performs on first
          # launch of a quarantined download.
          spctl -a -vvv -t exec "${APP}" 2>&1 | sed 's/^/  /' || true

      - name: Sparkle-sign the DMG
        id: sparkle_sign
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail
          SPARKLE_BIN="$(find "${RUNNER_TEMP}/spm" -path '*artifacts/sparkle/Sparkle/bin/sign_update' -print -quit)"
          if [ -z "${SPARKLE_BIN}" ]; then
            echo "::error::could not find Sparkle's sign_update in the resolved packages"
            exit 1
          fi
          echo "Using ${SPARKLE_BIN}"

          # `--ed-key-file -` reads the key from stdin, so it never lands on disk.
          printf '%s' "${SPARKLE_ED_PRIVATE_KEY}" \
            | "${SPARKLE_BIN}" --ed-key-file - "${DMG}" \
            > "${RUNNER_TEMP}/sparkle-signature.txt"
          cat "${RUNNER_TEMP}/sparkle-signature.txt"

          # Prove the signature we are about to publish is one the shipped app
          # will actually accept, before anything becomes public.
          signature="$(sed -E 's/.*edSignature="([^"]+)".*/\1/' "${RUNNER_TEMP}/sparkle-signature.txt")"
          public_key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "${{ steps.app.outputs.path }}/Contents/Info.plist")"
          python3 "${GITHUB_WORKSPACE}/scripts/sparkle_key_check.py" verify \
            --public-key "${public_key}" --signature "${signature}" "${DMG}"

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          NOTES_FILE: ${{ inputs.notes_file }}
        run: |
          set -euo pipefail
          NOTES="${RUNNER_TEMP}/notes.html"
          if [ -n "${NOTES_FILE}" ]; then
            if [ ! -f "${NOTES_FILE}" ]; then
              echo "::error::notes_file '${NOTES_FILE}' does not exist in the repository"
              exit 1
            fi
            cp "${NOTES_FILE}" "${NOTES}"
          else
            last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [ -n "${last_tag}" ]; then
              range="${last_tag}..HEAD"
            else
              range="HEAD"
            fi
            echo "Generating notes from commits in ${range}"
            python3 scripts/generate_release_notes.py "${VERSION}" --range "${range}" > "${NOTES}"
          fi
          echo "path=${NOTES}" >> "$GITHUB_OUTPUT"
          echo "----- release notes -----"
          cat "${NOTES}"

      # ------------------------------------------------------------------
      # Publish. Everything above is reversible; from here on it is not.
      # ------------------------------------------------------------------
      - name: Create the GitHub release
        id: publish
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.inputs.outputs.version }}
          BUILD: ${{ steps.inputs.outputs.build }}
          DMG: ${{ steps.dmg.outputs.path }}
          DMG_NAME: ${{ steps.dmg.outputs.name }}
          NOTES: ${{ steps.notes.outputs.path }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=(release create "v${VERSION}" "${DMG}#${DMG_NAME}"
                --title "DynamicNotch ${VERSION} (build ${BUILD})"
                --notes-file "${NOTES}")
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Resolve the appcast download URL
        id: download_url
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          DMG_NAME: ${{ steps.dmg.outputs.name }}
          DMG: ${{ steps.dmg.outputs.path }}
          DOWNLOAD_BASE_INPUT: ${{ inputs.download_base }}
          DOWNLOAD_BASE_VAR: ${{ vars.DOWNLOAD_BASE }}
        run: |
          set -euo pipefail
          # Precedence: per-run input > repository variable > GitHub release asset.
          base="${DOWNLOAD_BASE_INPUT}"
          if [ -z "${base}" ]; then
            base="${DOWNLOAD_BASE_VAR}"
          fi

          if [ -z "${base}" ]; then
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${DMG_NAME}"
            echo "No download base configured; the feed will point at the GitHub release asset."
            echo "::notice::Set the DOWNLOAD_BASE repository variable to serve from your own CDN instead."
          else
            base="${base%/}"
            url="${base}/${DMG_NAME}"
            echo "Verifying the CDN copy is reachable at ${url} ..."
            remote="$(curl -sSL --fail --max-time 60 -o /dev/null \
                       -w '%{http_code}' "${url}" 2>/dev/null || echo "000")"
            if [ "${remote}" != "200" ]; then
              echo "::error::${url} returned HTTP ${remote}."
              echo "::error::The appcast would advertise a download nobody can fetch, and Sparkle"
              echo "::error::would fail for every user. Either mirror the DMG first, or clear the"
              echo "::error::DOWNLOAD_BASE variable to fall back to the GitHub release asset."
              exit 1
            fi
            echo "CDN copy is live."
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Update the appcast
        id: appcast
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          BUILD: ${{ steps.inputs.outputs.build }}
          DMG: ${{ steps.dmg.outputs.path }}
          URL: ${{ steps.download_url.outputs.url }}
          MIN_SYSTEM_VERSION: ${{ inputs.min_system_version }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/sparkle-signature.txt" "${RUNNER_TEMP}/sig.txt"
          python3 scripts/update_appcast.py \
            --appcast updater/appcast.xml \
            --version "${VERSION}" \
            --build "${BUILD}" \
            --dmg "${DMG}" \
            --url "${URL}" \
            --signature-file "${RUNNER_TEMP}/sig.txt" \
            --release-notes "${NOTES}" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" \
            --min-system-version "${MIN_SYSTEM_VERSION}"
          /usr/bin/xmllint --noout updater/appcast.xml
          git --no-pager diff --stat -- updater/appcast.xml

      - name: Commit the appcast
        if: ${{ inputs.dry_run == false }}
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          BUILD: ${{ steps.inputs.outputs.build }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater/appcast.xml
          if git diff --cached --quiet; then
            echo "appcast unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "chore(appcast): DynamicNotch ${VERSION} (build ${BUILD})"
          # Pushing with GITHUB_TOKEN does not trigger other workflows, which is
          # why the Pages deploy is a separate job in this same run rather than
          # a side effect of static.yml.
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Keep the notarized DMG as a workflow artifact
        if: ${{ inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: DynamicNotch-${{ steps.inputs.outputs.version }}-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Clean up secrets
        if: always()
        run: |
          set +e
          security delete-keychain "${{ steps.signing.outputs.keychain_path }}" 2>/dev/null
          rm -f "${RUNNER_TEMP}/asc_api_key.p8" "${RUNNER_TEMP}/sparkle-signature.txt" "${RUNNER_TEMP}/sig.txt"
          echo "Removed the temporary keychain and the notarization key."

  publish-feed:
    name: Publish the update feed
    needs: release
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the feed
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: updater/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
